<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>360 Videon</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;600&display=swap">
<style>
/* QR ile açılan indirme sayfası: video sayfanın içinde oynar, altında Kaydet düğmesi */
:root{
  --bg:#14101c; --panel:#1f1a2b; --line:#3a3248; --fg:#f4eee6; --muted:#a99fb5;
  --accent:#e6c48a; --accent-fg:#14101c;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Manrope","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);padding:16px;box-sizing:border-box;
  padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom))}
main{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center}
h1{font-family:var(--display);font-weight:700;font-size:22px;margin:4px 0 0;text-wrap:balance}
.kutu{position:relative;width:auto;height:56vh;max-width:100%;aspect-ratio:9/16;max-height:56vh;border-radius:18px;overflow:hidden;background:var(--panel);border:1px solid var(--line)}
video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.bekle{position:absolute;inset:0;display:grid;place-items:center;padding:24px;color:var(--muted);line-height:1.5}
.kapak{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.bekle.ustte{background:linear-gradient(transparent 45%,rgba(20,16,28,.85));place-items:end center;color:var(--fg)}
.kutu iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.cark{width:42px;height:42px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);margin:0 auto 14px;animation:don 1s linear infinite}
@keyframes don{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.cark{animation:none}}
[hidden]{display:none!important}
.dugme{display:block;width:100%;box-sizing:border-box;padding:16px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-fg);
  font:600 17px var(--body);text-decoration:none;cursor:pointer}
.dugme[aria-disabled="true"]{opacity:.5;pointer-events:none}
.tekrar{display:flex;gap:14px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;width:100%;box-sizing:border-box}
.tekrar #sayfaQr{flex:none;width:96px;height:96px;background:#fff;border-radius:10px;padding:6px;box-sizing:border-box;line-height:0}
.tekrar #sayfaQr img,.tekrar #sayfaQr svg{width:100%;height:100%}
.tekrar p{margin:0;font-size:14px;line-height:1.45;color:var(--fg)}
.ipucu{color:var(--muted);font-size:14px;line-height:1.5;margin:0}
</style>
</head>
<body>
<main>
  <h1 id="marka">360 Videon</h1>
  <div class="kutu">
    <img class="kapak" id="kapak" alt="" hidden>
    <video id="vid" playsinline loop muted autoplay controls preload="auto" hidden></video>
    <div class="bekle" id="bekle"><div><div class="cark" aria-hidden="true"></div><span id="bekleYazi">Videon hazırlanıyor, birkaç saniye sürebilir…</span></div></div>
  </div>
  <a class="dugme" id="kaydet" href="#" aria-disabled="true">Videoyu Kaydet</a>
  <p class="ipucu" id="ipucu">Videoyu Kaydet'e dokun, video telefonuna kaydedilir.</p>
  <div class="tekrar" id="tekrar" hidden>
    <div id="sayfaQr" aria-hidden="true"><img id="sayfaQrResim" alt=""></div>
    <p><strong>Ekran görüntüsü almayı unutma.</strong><br>Videona daha sonra tekrar ulaşmak için bu ekranın görüntüsünü al.</p>
  </div>
</main>


<script>
const $ = id => document.getElementById(id);
const p = new URLSearchParams(location.search);
const id = p.get('id') || '';
if(p.get('m')){ $('marka').textContent = p.get('m'); document.title = p.get('m'); }

// Drive'daki dosyanın doğrudan adresi (paylaşımı "linke sahip herkes" açık)
const kaynak = 'https://drive.usercontent.google.com/download?id=' + encodeURIComponent(id) + '&export=download';
const ad = '360-video.mp4';
let dosya = null;     // paylaşım menüsü için önceden indirilen video
let deneme = 0;
let videoAcik = false;

const v = $('vid'), kaydet = $('kaydet');

// Telefona göre yönlendirme: iPhone paylaşım menüsüyle Fotoğraflar'a, Android doğrudan indirerek kaydeder
const iphone = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const android = /Android/i.test(navigator.userAgent);
$('ipucu').textContent = iphone
  ? 'Videoyu Kaydet\'e dokun, açılan menüden “Videoyu Kaydet”i seç. Video Fotoğraflar\'a kaydedilir.'
  : android
    ? 'Videoyu Kaydet\'e dokun, video telefonuna indirilir. Galeri veya İndirilenler klasöründe bulabilirsin.'
    : 'Videoyu Kaydet\'e dokun, video cihazına indirilir.';

// Kapak resmi: video yüklenene kadar misafir kendi görüntüsünü görür (Drive'a videodan önce yüklenir)
const kapakId = p.get('p');
if(kapakId){
  // İki farklı Google adresi sırayla denenir (biri başka sitelerde gösterilmeyi engelleyebiliyor)
  const adresler = ['https://lh3.googleusercontent.com/d/' + encodeURIComponent(kapakId),
                    'https://drive.usercontent.google.com/download?id=' + encodeURIComponent(kapakId) + '&export=view'];
  const k = $('kapak');
  let kd = 0;
  k.onload = () => { if(!videoAcik){ k.hidden = false; $('bekle').classList.add('ustte'); } v.poster = k.src; };
  k.onerror = () => { kd++; if(kd < 40) setTimeout(() => { k.src = adresler[kd % 2] + (kd > 1 ? (adresler[kd % 2].includes('?') ? '&' : '?') + 't=' + Date.now() : ''); }, kd < 2 ? 0 : 3000); };
  k.src = adresler[0];
}

function yukle(){
  // Video henüz Drive'a yüklenmediyse hata verir; birkaç saniyede bir yeniden denenir
  v.src = kaynak + '&t=' + Date.now();
  v.load();
}
v.addEventListener('loadeddata', () => {
  videoAcik = true;
  const ifr = document.querySelector('.kutu iframe'); if(ifr) ifr.remove();
  $('bekle').hidden = true; $('kapak').hidden = true; v.hidden = false;
  v.play().catch(()=>{});
  kaydet.href = kaynak; kaydet.setAttribute('download', ad); kaydet.removeAttribute('aria-disabled');
  onceden_indir();
});
v.addEventListener('error', () => {
  deneme++;
  // Tarayıcı videoyu sayfada oynatamasa bile dosya indirilebilir: 3 denemeden sonra düğmeyi aç
  if(deneme === 3){
    kaydet.href = kaynak; kaydet.setAttribute('download', ad); kaydet.removeAttribute('aria-disabled');
    $('bekleYazi').textContent = 'Önizleme yükleniyor… Beklemeden “Videoyu Kaydet” ile indirebilirsin.';
  }
  // Tarayıcı Drive videosunu sayfada oynatamıyorsa bekleme yerine kapak ve indirme yönlendirmesi kalır
  if(deneme === 5 && !videoAcik){
    $('bekle').querySelector('.cark').hidden = true;
    $('bekleYazi').textContent = 'Videon hazır! Aşağıdaki “Videoyu Kaydet” ile telefonuna indir.';
  }
  if(deneme > 60){ // ~4 dakika
    $('bekleYazi').textContent = 'Video şu an açılamadı. Biraz sonra QR kodu tekrar okutabilirsin.';
    return;
  }
  setTimeout(yukle, 4000);
});

// Paylaşım menüsü (iPhone'da "Videoyu Kaydet" ile Fotoğraflar'a kaydeder) için videoyu önceden al.
// Tarayıcı izin vermezse düğme normal indirme linki olarak çalışır.
async function onceden_indir(){
  try{
    if(!iphone || !navigator.canShare) return; // Android ve bilgisayarda doğrudan indirme daha pratik
    const r = await fetch(kaynak);
    if(!r.ok) return;
    const f = new File([await r.blob()], ad, {type:'video/mp4'});
    if(navigator.canShare({files:[f]})) dosya = f;
  }catch(e){}
}
kaydet.addEventListener('click', async e => {
  if(!dosya) return; // normal indirme
  e.preventDefault();
  try{ await navigator.share({files:[dosya]}); }
  catch(err){ if(err && err.name !== 'AbortError') location.href = kaynak; }
});

// Bu sayfanın kendi QR'ı: ekran görüntüsünden daha sonra tekrar açılabilsin
// (laptop bu QR resmini videodan hemen sonra Drive'a yükler; gelene kadar kutu gizli kalır)
const qrId = p.get('q');
if(qrId){
  const adresler = ['https://lh3.googleusercontent.com/d/' + encodeURIComponent(qrId),
                    'https://drive.usercontent.google.com/download?id=' + encodeURIComponent(qrId) + '&export=view'];
  const r = $('sayfaQrResim');
  let qd = 0;
  r.onload = () => { $('tekrar').hidden = false; };
  r.onerror = () => { qd++; if(qd < 60) setTimeout(() => { const a = adresler[qd % 2]; r.src = a + (a.includes('?') ? '&' : '?') + 't=' + Date.now(); }, qd < 2 ? 0 : 3000); };
  r.src = adresler[0];
}

if(id){ yukle(); } else { $('bekleYazi').textContent = 'Video bulunamadı. QR kodu tekrar okut.'; }
</script>
</body>
</html>
