# iPhone için imzasız IPA dosyası üretir (Mac gerekmez, GitHub'ın Mac sunucusunda çalışır).
# Çıkan IPA, Windows'ta Sideloadly ile ücretsiz Apple kimliğiyle imzalanıp telefona yüklenir.
# Çalıştırmak için: GitHub'da Actions sekmesi -> "iPhone IPA" -> Run workflow

name: iPhone IPA

on:
  workflow_dispatch:

jobs:
  derle:
    runs-on: macos-15
    timeout-minutes: 75
    env:
      CI: "1"
    steps:
      - name: Dosyaları al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Expo projesini oluştur
        run: |
          # Expo SDK 53'e sabitlendi: yeni sürümlerdeki ExpoModulesJSI derleme adımı imzasız derlemede hata veriyor
          npx --yes create-expo-app@latest cekim360 --template blank@sdk-53
          rm -f cekim360/App.tsx
          cp kaynak/App.js kaynak/app.json cekim360/

      - name: Paketleri kur
        working-directory: cekim360
        run: |
          npm install react-native-vision-camera@4
          npx expo install @react-native-async-storage/async-storage expo-keep-awake expo-network

      - name: iOS projesini hazırla
        working-directory: cekim360
        run: npx expo prebuild --platform ios --clean

      - name: Derle (imzasız)
        working-directory: cekim360/ios
        run: |
          WS=$(ls -d *.xcworkspace | head -n 1)
          SCHEME="${WS%.xcworkspace}"
          echo "Çalışma alanı: $WS / Şema: $SCHEME"
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/uygulama.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" > "$RUNNER_TEMP/derleme.log" 2>&1 || true
          tail -n 40 "$RUNNER_TEMP/derleme.log"
          test -d "$RUNNER_TEMP/uygulama.xcarchive/Products/Applications"

      - name: Hata özeti (sadece hata olursa)
        if: failure()
        run: |
          echo "----- Hata satırları -----"
          grep -nE "error:|Error:|ERROR|fatal|failed" "$RUNNER_TEMP/derleme.log" | grep -v "warning" | tail -n 60 || true

      - name: IPA dosyasını oluştur
        run: |
          mkdir -p Payload
          cp -R "$RUNNER_TEMP"/uygulama.xcarchive/Products/Applications/*.app Payload/
          # Uygulamanın JavaScript paketi içinde mi? Yoksa telefonda siyah ekranda kalır.
          ls -lh Payload/*.app/main.jsbundle || { echo "HATA: main.jsbundle yok, JS paketi derlemeye girmemiş"; exit 1; }
          zip -qry cekim360.ipa Payload
          ls -lh cekim360.ipa

      - name: IPA'yı indirilebilir yap
        uses: actions/upload-artifact@v4
        with:
          name: cekim360-ipa
          path: cekim360.ipa
          retention-days: 30
